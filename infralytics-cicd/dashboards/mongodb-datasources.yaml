apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: mongodb-infralytics
spec:
  allowCrossNamespaceImport: true
  datasource:
    access: proxy
    jsonData:
      authType: auth-username-password
      connectionParameters: authSource=admin&replicaSet=mongodb&tlsInsecure=true
      connectionStringScheme: dns_seed_list
      database: infralytics
      host: mongo.mongodb.svc.cluster.local
      username: infralytics
    name: mongodb-infralytics
    secureJsonData:
      password: ${password}
    type: haohanyang-mongodb-datasource
  instanceSelector: {}
  uid: mongodb-infralytics
  valuesFrom:
    - targetPath: secureJsonData.password
      valueFrom:
        secretKeyRef:
          key: password
          name: infralytics-mongodb-creds
---
