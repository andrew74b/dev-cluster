              "queryText": "[\r\n  {\r\n    \"$match\": {\r\n      \"run_type\": {\r\n        \"$in\": [\"daily\"]\r\n      },\r\n      \"metadata.site\": {\r\n        \"$regex\": \"$site\"\r\n      },\r\n      \"metadata.module\": {\r\n        \"$regex\": \"$module\"\r\n      },\r\n      \"metadata.type\": {\r\n        \"$regex\": \"$type\"\r\n      }\r\n    }\r\n  },\r\n  {\r\n    \"$lookup\": {\r\n      \"from\": \"task\",\r\n      \"localField\": \"task\",\r\n      \"foreignField\": \"name\",\r\n      \"as\": \"task_col\",\r\n      \"pipeline\": [\r\n        {\r\n          \"$match\": {\r\n            \"$expr\": {\r\n              \"$gte\": [\r\n                \"$date\",\r\n                {\r\n                  \"$dateSubtract\": {\r\n                    \"startDate\": {\r\n                      \"$date\": {\r\n                        \"$numberLong\": \"$__to\"\r\n                      }\r\n                    },\r\n                    \"unit\": \"day\",\r\n                    \"amount\": 30\r\n                  }\r\n                }\r\n              ]\r\n            }\r\n          }\r\n        }\r\n      ]\r\n    }\r\n  },\r\n  {\r\n    \"$unwind\": \"$task_col\"\r\n  },\r\n  {\r\n    \"$sort\": {\r\n      \"task_col.date\": -1\r\n    }\r\n  },\r\n  {\r\n    \"$match\": {\r\n      \"task_col.error_count\": 0\r\n    }\r\n  },\r\n  {\r\n    \"$group\": {\r\n      \"_id\": \"$task\",\r\n      \"latestChild\": {\r\n        \"$first\": \"$task_col\"\r\n      }\r\n    }\r\n  },\r\n  {\r\n    \"$project\": {\r\n      \"_id\": 0,\r\n      \"task\": \"$latestChild.name\",\r\n      \"date\": \"$latestChild.date\",\r\n      \"start_time\": \"$latestChild.start_time\",\r\n      \"finish_time\": \"$latestChild.finish_time\",\r\n      \"days_since_good\": {\r\n        \"$dateDiff\": {\r\n          \"startDate\": \"$latestChild.date\",\r\n          \"endDate\": \"$$NOW\",\r\n          \"unit\": \"day\"\r\n        }\r\n      }\r\n    }\r\n  },\r\n\r\n  {\r\n    \"$sort\":{\"days_since_good\":-1}\r\n  }\r\n]",
              "queryType": "table",
              "refId": "A"
            }
