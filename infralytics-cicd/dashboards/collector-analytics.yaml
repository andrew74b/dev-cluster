                "type": "haohanyang-mongodb-datasource",
                "uid": "${DS_MONGODB-INFRALYTICS}"
              },
              "isStreaming": false,
              "queryLanguage": "json",
              "queryText": "[\r\n  {\r\n    \"$match\": {\r\n      \"run_type\": {\r\n        \"$in\": [\r\n          \"daily\"\r\n        ]\r\n      },\r\n      \"metadata.site\": {\r\n        \"$regex\": \"$site\"\r\n      },\r\n      \"metadata.module\": {\r\n        \"$regex\": \"$module\"\r\n      },\r\n      \"metadata.type\": {\r\n        \"$regex\": \"$type\"\r\n      }\r\n    }\r\n  },\r\n  {\r\n    \"$lookup\": {\r\n      \"from\": \"task\",\r\n      \"localField\": \"task\",\r\n      \"foreignField\": \"name\",\r\n      \"as\": \"task_col\",\r\n      \"pipeline\": [\r\n        {\r\n          \"$match\": {\r\n            \"$expr\": {\r\n              \"$gte\": [\r\n                \"$date\",\r\n                {\r\n                  \"$dateSubtract\": {\r\n                    \"startDate\": {\r\n                      \"$date\": {\r\n                        \"$numberLong\": \"$__to\"\r\n                      }\r\n                    },\r\n                    \"unit\": \"day\",\r\n                    \"amount\": 30\r\n                  }\r\n                }\r\n              ]\r\n            }\r\n          }\r\n        }\r\n      ]\r\n    }\r\n  },\r\n  {\r\n    \"$unwind\": {\r\n      \"path\": \"$task_col\",\r\n      \"preserveNullAndEmptyArrays\": true\r\n    }\r\n  },\r\n  {\r\n    \"$sort\": {\r\n      \"task_col.date\": -1\r\n    }\r\n  },\r\n  {\r\n    \"$group\": {\r\n      \"_id\": \"$task\",\r\n      \"latestChild\": {\r\n        \"$firstN\": {\r\n          \"input\": \"$task_col\",\r\n          \"n\": 100000\r\n        }\r\n      }\r\n    }\r\n  },\r\n  {\r\n    \"$project\": {\r\n      \"_id\": 1,\r\n      \"latestChild\": {\r\n        \"$first\": {\r\n          \"$filter\": {\r\n            \"input\": \"$latestChild\",\r\n            \"as\": \"tmp\",\r\n            \"cond\": {\r\n              \"$eq\": [\r\n                \"$$tmp.error_count\",\r\n                0\r\n              ]\r\n            }\r\n          }\r\n        }\r\n      }\r\n    }\r\n  },\r\n  {\r\n    \"$project\": {\r\n      \"_id\": 0,\r\n      \"task\": \"$_id\",\r\n      \"days_since_good\": {\r\n        \"$ifNull\": [\r\n          {\r\n            \"$dateDiff\": {\r\n              \"startDate\": \"$latestChild.date\",\r\n              \"endDate\": \"$$NOW\",\r\n              \"unit\": \"day\"\r\n            }\r\n          },\r\n          30\r\n        ]\r\n      }\r\n    }\r\n  },\r\n  {\r\n    \"$project\": {\r\n      \"task\": \"$task\",\r\n      \"Last run failed\": {\r\n\r\n          \"$cond\": {\r\n            \"if\": {\r\n              \"$eq\": [\r\n                \"$days_since_good\",\r\n                1\r\n              ]\r\n            },\r\n            \"then\": 1,\r\n            \"else\": 0\r\n          }\r\n        \r\n      },\r\n      \"Warning\": {\r\n\r\n          \"$cond\": {\r\n            \"if\": {\r\n              \"$and\": [\r\n                {\r\n                  \"$gte\": [\r\n                    \"$days_since_good\",\r\n                    2\r\n                  ]\r\n                },\r\n                {\r\n                  \"$lte\": [\r\n                    \"$days_since_good\",\r\n                    6\r\n                  ]\r\n                }\r\n              ]\r\n            },\r\n            \"then\": 1,\r\n            \"else\": 0\r\n          \r\n        }\r\n      },\r\n      \"Critical\": {\r\n\r\n          \"$cond\": {\r\n            \"if\": {\r\n              \"$and\": [\r\n                {\r\n                  \"$gte\": [\r\n                    \"$days_since_good\",\r\n                    7\r\n                  ]\r\n                },\r\n                {\r\n                  \"$lte\": [\r\n                    \"$days_since_good\",\r\n                    13\r\n                  ]\r\n                }\r\n              ]\r\n            },\r\n            \"then\": 1,\r\n            \"else\": 0\r\n          }\r\n        \r\n      },\r\n      \"Severe\": {\r\n\r\n          \"$cond\": {\r\n            \"if\": {\r\n              \"$and\": [\r\n                {\r\n                  \"$gte\": [\r\n                    \"$days_since_good\",\r\n                    14\r\n                  ]\r\n                },\r\n                {\r\n                  \"$lte\": [\r\n                    \"$days_since_good\",\r\n                    29\r\n                  ]\r\n                }\r\n              ]\r\n            },\r\n            \"then\": 1,\r\n            \"else\": 0\r\n          }\r\n        \r\n      },\r\n      \"Catastrophic\": {\r\n\r\n          \"$cond\": {\r\n            \"if\": {\r\n              \"$and\": [\r\n                {\r\n                  \"$eq\": [\r\n                    \"$days_since_good\",\r\n                    30\r\n                  ]\r\n                }\r\n              ]\r\n            },\r\n            \"then\": 1,\r\n            \"else\": 0\r\n          }\r\n        }\r\n      \r\n    }\r\n  }\r\n]",
              "queryType": "table",
              "refId": "A"
