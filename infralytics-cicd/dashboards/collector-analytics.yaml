          "pluginVersion": "12.3.1",
          "targets": [
            {
              "collection": "task",
              "datasource": {
                "type": "haohanyang-mongodb-datasource",
                "uid": "${DS_MONGODB-INFRALYTICS}"
              },
              "isStreaming": false,
              "queryLanguage": "json",
              "queryText": "[\r\n  {\r\n    \"$match\": {\r\n      \"site\": {\r\n        \"$regex\": \"$site\"\r\n      },\r\n      \"module\": {\r\n        \"$regex\": \"$module\"\r\n      },\r\n      \"type\": {\r\n        \"$regex\": \"$type\"\r\n      },\r\n      \"$expr\": {\r\n        \"$gte\": [\r\n          \"$date\",\r\n          {\r\n            \"$dateSubtract\": {\r\n              \"startDate\": {\r\n                \"$date\": {\r\n                  \"$numberLong\": \"$__to\"\r\n                }\r\n              },\r\n              \"unit\": \"day\",\r\n              \"amount\": 30\r\n            }\r\n          }\r\n        ]\r\n      }\r\n    }\r\n  },\r\n  {\r\n    \"$group\": {\r\n      \"_id\": \"$date\",\r\n      \"error_count\": {\r\n        \"$sum\": {\r\n          \"$cond\": [\r\n            {\r\n              \"$gt\": [\r\n                \"$error_count\",\r\n                0\r\n              ]\r\n            },\r\n            1,\r\n            0\r\n          ]\r\n        }\r\n      },\r\n      \"count\": {\r\n        \"$sum\": {\r\n          \"$cond\": [\r\n            {\r\n              \"$eq\": [\r\n                \"$status\",\r\n                3\r\n              ]\r\n            },\r\n            1,\r\n            0\r\n          ]\r\n        }\r\n      },\r\n      \"active\": {\r\n        \"$push\": \"$$ROOT\"\r\n      }\r\n    }\r\n  },\r\n  {\r\n    \"$project\": {\r\n      \"success\": \"$count\",\r\n      \"errors\": \"$error_count\"\r\n    }\r\n  }\r\n]",
              "queryType": "table",
              "refId": "A"
