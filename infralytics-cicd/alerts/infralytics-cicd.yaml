apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: infralytics-cicd
spec:
  allowCrossNamespaceImport: true
  folderRef: infralytics-cicd
  instanceSelector: {}
  interval: 1m
  rules:
    - condition: C
      data:
        - datasourceUid: prometheus
          model:
            editorMode: code
            expr: topk(10, sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod))
            instant: true
            intervalMs: 1000
            legendFormat: __auto
            maxDataPoints: 43200
            range: false
            refId: A
          refId: A
          relativeTimeRange:
            from: 600
            to: 0
        - datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params:
                    - 1
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - C
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
          refId: C
          relativeTimeRange:
            from: 0
            to: 0
      execErrState: Error
      for: 10m
      isPaused: false
      labels:
        source: infralytics-cicd
      noDataState: NoData
      title: High pod cpu usage
      uid: ffioqipxnc1z4e
