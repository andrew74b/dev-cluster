apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: sonarqube
spec:
  destination:
    name: in-cluster
    namespace: sonarqube
  project: default
  sources:
    - chart: sonarqube
      helm:
        valuesObject:
          community:
            enabled: true
          elasticsearch:
            bootstrapChecks: false
          env:
            - name: SONAR_JDBC_URL
              valueFrom:
                secretKeyRef:
                  key: jdbc-uri
                  name: sonardb-app
            - name: SONAR_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  key: user
                  name: sonardb-app
          ingress:
            annotations:
              nginx.ingress.kubernetes.io/proxy-body-size: 25m
            enabled: true
            hosts:
              - name: sonarqube.pandathedog.com
                path: /
            ingressClassName: nginx
            tls:
              - hosts:
                  - '*.pandathedog.com'
          initFs:
            enabled: false
          initSysctl:
            enabled: false
          jdbcOverwrite:
            enabled: true
            jdbcSecretName: sonardb-app
            jdbcSecretPasswordKey: password
          livenessProbe:
            initialDelaySeconds: 120
          monitoringPasscode: define_it
          postgresql:
            enabled: false
          resources:
            limits:
              memory: 4Gi
          sonarProperties:
            sonar.auth.saml.applicationId: sonarqube
            sonar.auth.saml.certificate.secured: 
            sonar.auth.saml.enabled: true
            sonar.auth.saml.group.name: groups
            sonar.auth.saml.loginUrl: https://auth.pandathedog.com/realms/internal/protocol/saml
            sonar.auth.saml.providerId: https://auth.pandathedog.com/realms/internal
            sonar.auth.saml.providerName: Keycloak
            sonar.auth.saml.signature.enabled: false
            sonar.auth.saml.user.email: email
            sonar.auth.saml.user.login: login
            sonar.auth.saml.user.name: name
            sonar.core.serverBaseURL: https://sonarqube.pandathedog.com
      repoURL: https://SonarSource.github.io/helm-chart-sonarqube
      targetRevision: 2025.6.1
    - path: sonarqube
      repoURL: https://github.com/andrew74b/dev-cluster
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
    syncOptions:
      - CreateNamespace=true
