apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops
spec:
  destination:
    name: in-cluster
    namespace: sops
  project: default
  sources:
    - chart: sops-secrets-operator
      helm:
        valueFiles:
          - $self/sops/values.yaml
      repoURL: https://isindir.github.io/sops-secrets-operator
      targetRevision: 0.27.1
    - path: ""
      ref: self
      repoURL: https://github.com/andrew74b/dev-cluster
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
