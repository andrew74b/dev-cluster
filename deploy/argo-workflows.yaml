apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: argo-workflows
spec:
  destination:
    name: in-cluster
    namespace: argo
  project: default
  sources:
    - chart: argo-workflows
      helm:
        valuesObject:
          controller:
            extraEnv:
              - name: INFORMER_WRITE_BACK
                value: "false"
            links:
              - name: Grafana Logs
                scope: workflow
                url: https://grafana.pandathedog.com/explore?schemaVersion=1&orgId=1&panes={"vls":{"datasource":"victoria-logs","queries":[{"datasource":{"type":"victoriametrics-logs-datasource","uid":"victoria-logs"},"expr":"{kubernetes.pod_namespace='${metadata.namespace}',kubernetes.pod_name=~'^${metadata.name}.*'}","refId":"A"}],"range":{"from":"${status.startedAtEpoch}","to":"${status.finishedAtEpoch}"}}}
              - name: Grafana Logs
                scope: pod
                url: https://grafana.pandathedog.com/explore?schemaVersion=1&orgId=1&panes={"vls":{"datasource":"victoria-logs","queries":[{"datasource":{"type":"victoriametrics-logs-datasource","uid":"victoria-logs"},"expr":"{kubernetes.pod_namespace='${metadata.namespace}',kubernetes.pod_name='${metadata.name}'}","refId":"A"}],"range":{"from":"${status.startedAtEpoch}","to":"${status.finishedAtEpoch}"}}}
              - name: Grafana Pod Logs
                scope: pod-logs
                url: https://grafana.pandathedog.com/explore?schemaVersion=1&orgId=1&panes={"vls":{"datasource":"victoria-logs","queries":[{"datasource":{"type":"victoriametrics-logs-datasource","uid":"victoria-logs"},"expr":"{kubernetes.pod_namespace='${metadata.namespace}',kubernetes.pod_name=~'^${metadata.name}.*'}","refId":"A"}],"range":{"from":"${status.startedAtEpoch}","to":"${status.finishedAtEpoch}"}}}
              - name: Grafana Event Source Logs
                scope: event-source-logs
                url: https://grafana.pandathedog.com/explore?schemaVersion=1&orgId=1&panes={"vls":{"datasource":"victoria-logs","queries":[{"datasource":{"type":"victoriametrics-logs-datasource","uid":"victoria-logs"},"expr":"{kubernetes.pod_namespace='${metadata.namespace}',kubernetes.pod_name=~'^${metadata.name}-eventsource.*'}","refId":"A"}],"range":{"from":"${status.startedAtEpoch}","to":"${status.finishedAtEpoch}"}}}
              - name: Grafana Sensor Logs
                scope: sensor-logs
                url: https://grafana.pandathedog.com/explore?schemaVersion=1&orgId=1&panes={"vls":{"datasource":"victoria-logs","queries":[{"datasource":{"type":"victoriametrics-logs-datasource","uid":"victoria-logs"},"expr":"{kubernetes.pod_namespace='${metadata.namespace}',kubernetes.pod_name=~'^${metadata.name}-sensor.*'}","refId":"A"}],"range":{"from":"${status.startedAtEpoch}","to":"${status.finishedAtEpoch}"}}}
              - name: Completed Workflows
                scope: workflow-list
                url: https://argo-workflows.pandathedog.com/workflows?label=workflows.argoproj.io%2Fcompleted%3Dtrue
            namespaceParallelism: 1
            rbac:
              writeConfigMaps: true
            resourceRateLimit:
              burst: 10
              limit: 10
            workflowDefaults:
              spec:
                activeDeadlineSeconds: 900
                artifactGC:
                  forceFinalizerRemoval: true
                  serviceAccountName: argo-workflow
                  strategy: OnWorkflowDeletion
                imagePullSecrets:
                  - name: harbor-registry
                podGC:
                  deleteDelayDuration: 48h
                  strategy: OnWorkflowSuccess
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                serviceAccountName: argo-workflow
                ttlStrategy:
                  secondsAfterCompletion: 1209600
            workflowNamespaces: []
          extraObjects:
            - apiVersion: v1
              kind: Secret
              metadata:
                annotations:
                  kubernetes.io/service-account.name: admin
                name: admin.service-account-token
              type: kubernetes.io/service-account-token
            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                annotations:
                  workflows.argoproj.io/rbac-rule: '''ArgoWorkflowAdmins'' in groups'
                  workflows.argoproj.io/rbac-rule-precedence: "1"
                name: admin
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: argo-workflows-admin-user
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: edit
              subjects:
                - kind: ServiceAccount
                  name: admin
                  namespace: argo
            - apiVersion: v1
              kind: Secret
              metadata:
                annotations:
                  kubernetes.io/service-account.name: read-only
                name: read-only.service-account-token
              type: kubernetes.io/service-account-token
            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                annotations:
                  workflows.argoproj.io/rbac-rule: "true"
                  workflows.argoproj.io/rbac-rule-precedence: "0"
                name: read-only
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: argo-workflows-read-only-user
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: view
              subjects:
                - kind: ServiceAccount
                  name: read-only
                  namespace: argo
          server:
            authModes:
              - client
              - sso
            ingress:
              enabled: true
              hosts:
                - argo-workflows.pandathedog.com
              ingressClassName: nginx
              tls:
                - hosts:
                    - '*.pandathedog.com'
            sso:
              clientId:
                key: client-id
                name: argo-server-sso
              clientSecret:
                key: client-secret
                name: argo-server-sso
              enabled: true
              insecureSkipVerify: false
              issuer: https://auth.pandathedog.com/realms/internal
              rbac:
                enabled: true
              redirectUrl: https://argo-workflows.pandathedog.com/oauth2/callback
              scopes:
                - groups
              sessionExpiry: 24h
              userInfoPath: /protocol/openid-connect/userinfo
          workflow:
            rbac:
              create: false
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 1.0.18
    - path: argo-workflows
      repoURL: https://github.com/andrew74b/dev-cluster
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
    syncOptions:
      - CreateNamespace=true
