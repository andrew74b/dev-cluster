apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: gitea
spec:
  destination:
    name: in-cluster
    namespace: gitea
  project: default
  sources:
    - chart: gitea
      helm:
        valuesObject:
          gitea:
            additionalConfigFromEnvs:
              - name: GITEA__DATABASE__HOST
                valueFrom:
                  secretKeyRef:
                    key: host
                    name: giteadb-app
              - name: GITEA__DATABASE__NAME
                valueFrom:
                  secretKeyRef:
                    key: dbname
                    name: giteadb-app
              - name: GITEA__DATABASE__USER
                valueFrom:
                  secretKeyRef:
                    key: user
                    name: giteadb-app
              - name: GITEA__DATABASE__PASSWD
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: giteadb-app
              - name: GITEA__MAILER__USER
                valueFrom:
                  secretKeyRef:
                    key: username
                    name: gitea-smtp-creds
              - name: GITEA__MAILER__PASSWD
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: gitea-smtp-creds
              - name: GITEA__STORAGE__MINIO_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    key: accessKey
                    name: gitea-minio-creds
              - name: GITEA__STORAGE__MINIO_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    key: secretKey
                    name: gitea-minio-creds
            admin:
              existingSecret: gitea-admin-creds
            config:
              actions:
                DEFAULT_ACTIONS_URL: github
              cache:
                ADAPTER: redis
                HOST: redis://redis.gitea.svc:6379/0?pool_size=100&idle_timeout=180s&
              database:
                DB_TYPE: postgres
                SSL_MODE: require
              indexer:
                ISSUE_INDEXER_TYPE: bleve
                REPO_INDEXER_ENABLED: true
              oauth2_client:
                ACCOUNT_LINKING: disabled
                ENABLE_AUTO_REGISTRATION: true
                USERNAME: preferred_username
              queue:
                CONN_STR: redis://redis.gitea.svc:6379/0?pool_size=100&idle_timeout=180s&
                TYPE: redis
              server:
                OFFLINE_MODE: false
              service:
                DISABLE_REGISTRATION: true
              service.explore:
                REQUIRE_SIGNIN_VIEW: true
              session:
                PROVIDER: redis
                PROVIDER_CONFIG: redis://redis.gitea.svc:6379/0?pool_size=100&idle_timeout=180s&
              storage:
                MINIO_ENDPOINT: s3.pandathedog.com
                MINIO_USE_SSL: true
                STORAGE_TYPE: minio
            oauth:
              - autoDiscoverUrl: https://auth.pandathedog.com/realms/internal/.well-known/openid-configuration
                existingSecret: gitea-oauth-client
                name: Keycloak
                provider: openidConnect
          image:
            registry: docker.io
            repository: gitea/gitea
            rootless: true
            tag: 1.27.0
          ingress:
            annotations:
              nginx.ingress.kubernetes.io/proxy-body-size: 250m
            className: nginx
            enabled: true
            hosts:
              - host: git.pandathedog.com
                paths:
                  - path: /
            tls:
              - hosts:
                  - '*.pandathedog.com'
          postgresql-ha:
            enabled: false
          valkey-cluster:
            enabled: false
      repoURL: https://dl.gitea.com/charts
      targetRevision: 12.7.0
    - path: gitea
      repoURL: https://github.com/andrew74b/dev-cluster
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
    syncOptions:
      - CreateNamespace=true
