apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: docubuilder-cert
spec:
  commonName: system:node:*.svc.cluster.local
  dnsNames:
    - '*.docubuilder'
    - '*.docubuilder.svc.cluster.local'
    - '*.docubuilder.infralytics.svc.cluster.local'
    - '*.infralytics'
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-issuer
  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 384
  secretName: docubuilder-tls
  subject:
    organizations:
      - system:nodes
  usages:
    - digital signature
    - key encipherment
    - data encipherment
    - server auth
    - client auth
