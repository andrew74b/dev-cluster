apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
  name: openbao-setup
spec:
  arguments:
    parameters:
      - name: secret-name
        value: openbao-initial-secret
      - name: openbao-domain
        value: https://openbao.pandathedog.com
  entrypoint: main
  imagePullSecrets: []
  templates:
    - dag:
        tasks:
          - name: init-status
            template: init-status
          - depends: init-status.Failed
            name: initialize
            template: initialize
          - arguments:
              parameters:
                - name: json
                  value: '{{tasks.initialize.outputs.result}}'
            depends: initialize.Succeeded
            name: save-secret
            template: save-secret
          - depends: save-secret.Succeeded
            name: auth-setup
            template: auth-setup
      name: main
    - container:
        args:
          - bao operator init -status
        command:
          - sh
          - -c
        env:
          - name: BAO_ADDR
            value: https://openbao-0.openbao-internal:8200
          - name: BAO_CACERT
            value: /certs/ca-bundle.pem
        image: quay.io/openbao/openbao
        name: main
        volumeMounts:
          - mountPath: /certs/ca-bundle.pem
            name: ca-bundle
            subPath: ca-bundle.pem
      name: init-status
    - name: initialize
      script:
        command:
          - sh
          - -c
        env:
          - name: BAO_ADDR
            value: https://openbao-0.openbao-internal:8200
          - name: BAO_CACERT
            value: /certs/ca-bundle.pem
        image: quay.io/openbao/openbao
        name: main
        source: bao operator init -format=json
        volumeMounts:
          - mountPath: /certs/ca-bundle.pem
            name: ca-bundle
            subPath: ca-bundle.pem
    - inputs:
        parameters:
          - name: json
      name: save-secret
      resource:
        action: apply
        manifest: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{workflow.parameters.secret-name}}"
          stringData:
            root_token: "{{=jsonpath(inputs.parameters.json, '$.root_token')}}"
    - container:
        args:
          - |
            bao auth enable approle

            bao write auth/approle/role/infralytics-admin \
              token_policies="infralytics-admin" \
              token_ttl=1h token_max_ttl=4h

            bao auth enable -listing-visibility=unauth oidc

            bao write auth/oidc/config \
              oidc_discovery_url="$OIDC_DISCOVERY_URL" \
              oidc_discovery_ca_pem=@/certs/ca-bundle.pem \
              oidc_client_id="$OIDC_CLIENT_ID" \
              oidc_client_secret="$OIDC_CLIENT_SECRET" \
              default_role="keycloak-default"

            bao write auth/oidc/role/keycloak-default \
              bound_audiences="$OIDC_CLIENT_ID" \
              allowed_redirect_uris="{{workflow.parameters.openbao-domain}}/ui/vault/auth/oidc/oidc/callback" \
              allowed_redirect_uris="http://localhost:8250/oidc/callback" \
              user_claim="preferred_username" \
              oidc_scopes="profile,groups" groups_claim=groups \
              token_policies="default"

            bao secrets enable -path infralytics -version=2 kv

            accessor=$(bao read -field=accessor sys/auth/oidc)
            pairs="admin=OpenBao-Admins infralytics-admin=Infralytics-Admins infralytics-reader=Infralytics-Users"

            for pair in $pairs; do
              group=$(echo $pair | cut -d "=" -f1)
              alias=$(echo $pair | cut -d "=" -f2 | sed "s/-/ /g")
              bao policy write $group $group.hcl
              id=$(bao write -field=id identity/group name="$group" policies="$group" type="external")
              bao write identity/group-alias name="$alias" mount_accessor="$accessor" canonical_id="$id"
            done
        command:
          - sh
          - -c
        env:
          - name: BAO_ADDR
            value: https://openbao-0.openbao-internal:8200
          - name: BAO_CACERT
            value: /certs/ca-bundle.pem
          - name: BAO_TOKEN
            valueFrom:
              secretKeyRef:
                key: root_token
                name: '{{workflow.parameters.secret-name}}'
        envFrom:
          - secretRef:
              name: openbao-oidc
        image: quay.io/openbao/openbao
        name: main
        volumeMounts:
          - mountPath: /certs/ca-bundle.pem
            name: ca-bundle
            subPath: ca-bundle.pem
          - mountPath: /tmp
            name: policies
        workingDir: /tmp
      name: auth-setup
      volumes:
        - configMap:
            name: openbao-policies
          name: policies
  ttlStrategy: {}
  volumes:
    - configMap:
        name: ca-bundle
      name: ca-bundle
