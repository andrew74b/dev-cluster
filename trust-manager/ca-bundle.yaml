apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: ca-bundle
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        key: tls.crt
        selector:
          matchLabels:
            trust-bundle.ca-bundle: include
  target:
    configMap:
      key: ca-bundle.pem
    namespaceSelector:
      matchLabels:
        linkerd.io/inject: enabled
