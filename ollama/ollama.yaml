apiVersion: v1
kind: Service
metadata:
  name: ollama-svc
spec:
  ports:
    - port: 11434
  selector:
    app.kubernetes.io/name: ollama
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  serviceName: ollama-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - image: ollama/ollama:0.32.4
          name: ollama
          ports:
            - containerPort: 11434
          resources:
            limits: {}
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-data
  volumeClaimTemplates:
    - metadata:
        name: ollama-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
