apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  serviceName: open-webui-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      containers:
        - env: []
          envFrom:
            - secretRef:
                name: openwebui-env
          image: ghcr.io/open-webui/open-webui:0.11.0
          name: open-webui
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "0"
          volumeMounts:
            - mountPath: /app/backend/data
              name: open-webui-data
      volumes: []
  volumeClaimTemplates:
    - metadata:
        name: open-webui-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-svc
spec:
  ports:
    - port: 8080
  selector:
    app.kubernetes.io/name: open-webui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  name: open-webui-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: open-webui.pandathedog.com
      http:
        paths:
          - backend:
              service:
                name: open-webui-svc
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - '*.pandathedog.com'
