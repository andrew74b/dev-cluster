<!doctype html>
<html lang="{lang}">
  <head>
    <title>{title}</title>
    <meta name="theme-color" content="#FFF" />
    <meta name="slack-app-id" content="{slack-app-id}" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="{description}" />
    <meta name="darkreader-lock" />
    {head-tags}
    <style>
      @font-face {
        font-family: "Inter";
        font-display: swap;
        font-feature-settings: "ss03", "cv05";
        src: url("{cdn-url}/fonts/Inter.var.woff2") format("woff2");
      }

      @font-face {
        font-family: "Inter";
        font-display: swap;
        font-feature-settings: "ss03", "cv05";
        font-style: italic;
        src: url("{cdn-url}/fonts/Inter-italic.var.woff2") format("woff2");
      }

      body,
      html {
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        width: 100%;
        height: 100%;
      }

      @media print {
        body {
          display: block;
        }
      }

      #root {
        flex: 1;
        min-height: 100%;
        width: 100%;
      }

      .screenreader-only {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      @media print {
        .screenreader-only {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    {env}
    <script nonce="{csp-nonce}">
      if (
        window.localStorage &&
        window.localStorage.getItem("theme") === "dark"
      ) {
        var color = "#111319";
        document.querySelector("#root").style.background = color;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", color);
      }

      const bannerText = "DYNAMIC CONTENT - HIGHEST POSSIBLE CLASSIFICATION UNCLASSIFIED";

      const header = document.createElement("div");
      header.style.display = "block";
      header.style.position = "fixed";
      header.style.width = "100%";
      header.style.zIndex = 1000;
      header.style.textAlign = "center";
      header.style.fontSize = "small";
      header.style.userSelect = "none";
      header.style.marginTop = "-3px";
      header.textContent = bannerText;

      document.addEventListener("DOMContentLoaded", function () {
        document.body.prepend(header);
      });
    </script>
    {script-tags}
    <div class="screenreader-only">{content}</div>
  </body>
</html>
